name: e-skylab-keycloak

x-keycloak-image: &keycloak-image ghcr.io/skylab-kulubu/e-skylab-keycloak@sha256:${KEYCLOAK_IMAGE_DIGEST:?set the 64-character manifest digest without sha256 prefix}

services:
  keycloak-preflight:
    image: *keycloak-image
    pull_policy: always
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/opt/keycloak/config/preflight-production.sh"]
    environment:
      KEYCLOAK_IMAGE_DIGEST: ${KEYCLOAK_IMAGE_DIGEST:?set the 64-character manifest digest without sha256 prefix}
      KEYCLOAK_DB_VOLUME_NAME: ${KEYCLOAK_DB_VOLUME_NAME:?set the existing production PostgreSQL volume name}
      KEYCLOAK_DATA_VOLUME_NAME: ${KEYCLOAK_DATA_VOLUME_NAME:?set the existing production Keycloak data volume name}
      ACCOUNT_CENTER_BASE_URL: ${ACCOUNT_CENTER_BASE_URL:-https://my.yildizskylab.com}
    volumes:
      - keycloak_db_data:/mnt/keycloak-db:ro
    restart: "no"

  keycloak:
    image: *keycloak-image
    pull_policy: always
    command: ["start", "--optimized"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KEYCLOAK_PROXY_TRUSTED_ADDRESSES:?set reverse proxy IPs or CIDRs}
      KC_HTTP_ENABLED: "true"

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST:-keycloak-db}:${KEYCLOAK_DB_PORT:-5432}/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}

      KK_TO_RMQ_URL: ${RABBITMQ_HOST:?set RABBITMQ_HOST}
      KK_TO_RMQ_PORT: ${RABBITMQ_PORT:-5672}
      KK_TO_RMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME}
      KK_TO_RMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      KK_TO_RMQ_VHOST: ${RABBITMQ_VHOST:-/}
      KK_TO_RMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-keycloak.events}
      KK_TO_RMQ_USE_TLS: ${RABBITMQ_USE_TLS:-false}
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      keycloak-preflight:
        condition: service_completed_successfully
      keycloak-db:
        condition: service_started
    networks:
      - skynet
      - keycloak-db
    restart: unless-stopped

  keycloak-config:
    image: *keycloak-image
    pull_policy: always
    entrypoint: ["/opt/keycloak/config/reconcile-account-center.sh"]
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: e-skylab
      KEYCLOAK_CONFIG_CLIENT_ID: ${KEYCLOAK_CONFIG_CLIENT_ID:-account-center-config}
      KEYCLOAK_CONFIG_CLIENT_SECRET: ${KEYCLOAK_CONFIG_CLIENT_SECRET:?set scoped reconciler client secret}
      ACCOUNT_CENTER_BASE_URL: ${ACCOUNT_CENTER_BASE_URL:-https://my.yildizskylab.com}
      ACCOUNT_CENTER_REQUIRE_PRODUCTION_HOST: "true"
    depends_on:
      keycloak-preflight:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      - skynet
      - keycloak-db
    restart: "no"

  keycloak-db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    depends_on:
      keycloak-preflight:
        condition: service_completed_successfully
    networks:
      - keycloak-db
    restart: unless-stopped

volumes:
  keycloak_data:
    external: true
    name: ${KEYCLOAK_DATA_VOLUME_NAME:?set the existing production Keycloak data volume name}
  keycloak_db_data:
    external: true
    name: ${KEYCLOAK_DB_VOLUME_NAME:?set the existing production PostgreSQL volume name}

networks:
  skynet:
    external: true
  keycloak-db:
    internal: true
