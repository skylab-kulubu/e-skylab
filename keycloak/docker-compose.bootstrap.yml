services:
  keycloak-bootstrap:
    image: ghcr.io/skylab-kulubu/e-skylab-keycloak@sha256:${KEYCLOAK_IMAGE_DIGEST:?set the 64-character manifest digest without sha256 prefix}
    pull_policy: always
    entrypoint: ["/opt/keycloak/config/bootstrap-reconciler.sh"]
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_REALM: e-skylab
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set temporary bootstrap admin username}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set temporary bootstrap admin password}
      KEYCLOAK_CONFIG_CLIENT_ID: ${KEYCLOAK_CONFIG_CLIENT_ID:-account-center-config}
      KEYCLOAK_CONFIG_CLIENT_SECRET: ${KEYCLOAK_CONFIG_CLIENT_SECRET:?set scoped reconciler client secret}
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - skynet
    restart: "no"
    profiles: [bootstrap]
