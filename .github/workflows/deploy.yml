name: e-skylab ci

on:
  push:
    tags:
      - 'gateway/v*'
      - 'eureka/v*'
      - 'keycloak/v*'

jobs:
  gateway-build:
    if: startsWith(github.ref, 'refs/tags/gateway/')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v6

      - name: Extract Clean Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/gateway/}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Gateway
        uses: docker/build-push-action@v7
        with:
          context: ./gateway
          push: true
          tags: |
            ghcr.io/skylab-kulubu/e-skylab-gateway:latest
            ghcr.io/skylab-kulubu/e-skylab-gateway:${{ steps.get_version.outputs.VERSION }}

  eureka-build:
    if: startsWith(github.ref, 'refs/tags/eureka/')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v6

      - name: Extract Clean Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/eureka/}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Eureka
        uses: docker/build-push-action@v7
        with:
          context: ./eureka
          push: true
          tags: |
            ghcr.io/skylab-kulubu/e-skylab-eureka:latest
            ghcr.io/skylab-kulubu/e-skylab-eureka:${{ steps.get_version.outputs.VERSION }}

  keycloak-build:
    if: startsWith(github.ref, 'refs/tags/keycloak/')
    runs-on: ubuntu-latest
    environment: keycloak-production
    permissions: { contents: read }
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      PUBLISH_IMAGE: ghcr.io/skylab-kulubu/e-skylab-keycloak
      PHYSICAL_WEBAUTHN_APPROVED_COMMIT: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_COMMIT }}
      PHYSICAL_WEBAUTHN_EVIDENCE_URL: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_EVIDENCE_URL }}
      PHYSICAL_WEBAUTHN_APPROVED_SURFACES: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_SURFACES }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tag to point at current main
        run: |
          git fetch --no-tags origin main
          tagged_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          main_commit=$(git rev-parse origin/main)
          if [[ "$tagged_commit" != "$main_commit" ]]; then
            echo "The Keycloak release tag must point at the current main commit." >&2
            exit 1
          fi

      - name: Verify Keycloak and fixture image pins
        run: |
          bash keycloak/tests/check-version-consistency.sh
          bash keycloak/tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: keycloak/theme/package-lock.json

      - name: Test and build the source-controlled login theme
        working-directory: keycloak/theme
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Extract and validate version
        id: get_version
        run: |
          version=${GITHUB_REF#refs/tags/keycloak/v}
          approved_version=$(sed -n \
            's|^ARG KEYCLOAK_IMAGE=.*keycloak:\([^@]*\)@sha256:.*|\1|p' \
            keycloak/Dockerfile)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The Keycloak release tag must contain a semantic version." >&2
            exit 1
          fi
          if [[ "$version" != "$approved_version" ]]; then
            echo "Tag version $version does not match image version $approved_version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build candidate image once
        uses: docker/build-push-action@v7
        with:
          context: ./keycloak
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.KEYCLOAK_TEST_IMAGE }}

      - name: Test candidate image
        run: bash keycloak/tests/run-integration.sh

      - name: Require physical WebAuthn rollout evidence for this commit
        run: bash keycloak/tests/check-physical-webauthn-release.sh

      - name: Package the tested image bytes
        run: |
          artifact_dir="$RUNNER_TEMP/keycloak-candidate"
          mkdir -p "$artifact_dir"
          docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE" > "$artifact_dir/image-id"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/commit-sha"
          printf '%s\n' "${{ steps.get_version.outputs.VERSION }}" > "$artifact_dir/version"
          docker save "$KEYCLOAK_TEST_IMAGE" | gzip -1 > "$artifact_dir/candidate-image.tar.gz"

          provider_dir="$RUNNER_TEMP/tested-keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cp "$provider_dir/e-skylab-theme-2.0.0.jar" "$artifact_dir/"
          THEME_JAR="$artifact_dir/e-skylab-theme-2.0.0.jar" \
            bash keycloak/tests/check-theme-contract.sh
          (
            cd "$artifact_dir"
            sha256sum candidate-image.tar.gz e-skylab-theme-2.0.0.jar > SHA256SUMS
          )

      - name: Upload the commit-bound tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate
          if-no-files-found: error
          retention-days: 1

  keycloak-publish:
    if: startsWith(github.ref, 'refs/tags/keycloak/')
    needs: keycloak-build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      PUBLISH_IMAGE: ghcr.io/skylab-kulubu/e-skylab-keycloak
    steps:
      - uses: actions/checkout@v7

      - name: Download the tested candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate

      - name: Verify and load the tested candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/keycloak-candidate
          VERSION: ${{ needs.keycloak-build.outputs.version }}
        run: |
          test "$(cat "$CANDIDATE_DIR/commit-sha")" = "$GITHUB_SHA"
          test "$(cat "$CANDIDATE_DIR/version")" = "$VERSION"
          (
            cd "$CANDIDATE_DIR"
            sha256sum --check SHA256SUMS
          )
          gzip -dc "$CANDIDATE_DIR/candidate-image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$(cat "$CANDIDATE_DIR/image-id")"

          provider_dir="$RUNNER_TEMP/keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cmp "$provider_dir/e-skylab-theme-2.0.0.jar" "$CANDIDATE_DIR/e-skylab-theme-2.0.0.jar"
          THEME_JAR="$CANDIDATE_DIR/e-skylab-theme-2.0.0.jar" \
            bash keycloak/tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image bytes
        env:
          VERSION: ${{ needs.keycloak-build.outputs.version }}
        run: |
          version_image="$PUBLISH_IMAGE:$VERSION"
          latest_image="$PUBLISH_IMAGE:latest"
          main_image="$PUBLISH_IMAGE:main"
          production_image="$PUBLISH_IMAGE:production"
          candidate_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")

          published_images=(
            "$version_image"
            "$latest_image"
            "$main_image"
            "$production_image"
          )
          for image in "${published_images[@]}"; do
            docker tag "$KEYCLOAK_TEST_IMAGE" "$image"
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$candidate_id"
            docker push "$image"
          done

          version_digest="sha256:$(docker buildx imagetools inspect --raw "$version_image" | sha256sum | cut -d' ' -f1)"
          for image in "${published_images[@]:1}"; do
            alias_digest="sha256:$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)"
            test "$version_digest" = "$alias_digest"
          done

          {
            echo "### Tested Keycloak artifact"
            echo
            echo "\`$version_image@$version_digest\`"
            echo
            echo "Mutable aliases: \`latest\`, \`main\`, \`production\`"
            echo
            echo "Candidate commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
